AWSTemplateFormatVersion: '2010-09-09'
Description: S3 buckets for Airline Contact Center

Parameters:
  Environment:
    Type: String
    Description: Environment name

Resources:
  # ==================== KNOWLEDGE BASE BUCKET ====================
  KnowledgeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${Environment}-airline-knowledge-base-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: DeleteOldVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: airline-contact-center

  # ==================== TRANSCRIPTS BUCKET ====================
  TranscriptsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${Environment}-airline-transcripts-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: TransitionToIA
            Status: Enabled
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 30
          - Id: DeleteOldTranscripts
            Status: Enabled
            ExpirationInDays: 365
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: airline-contact-center

  # ==================== BUCKET POLICIES ====================
  KnowledgeBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref KnowledgeBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EnforceSSL
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt KnowledgeBucket.Arn
              - !Sub '${KnowledgeBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

  TranscriptsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TranscriptsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: EnforceSSL
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt TranscriptsBucket.Arn
              - !Sub '${TranscriptsBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': 'false'

Outputs:
  KnowledgeBucketName:
    Description: Knowledge Base Bucket Name
    Value: !Ref KnowledgeBucket

  KnowledgeBucketArn:
    Description: Knowledge Base Bucket ARN
    Value: !GetAtt KnowledgeBucket.Arn

  TranscriptsBucketName:
    Description: Transcripts Bucket Name
    Value: !Ref TranscriptsBucket

  TranscriptsBucketArn:
    Description: Transcripts Bucket ARN
    Value: !GetAtt TranscriptsBucket.Arn
