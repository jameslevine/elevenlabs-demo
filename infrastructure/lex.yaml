AWSTemplateFormatVersion: '2010-09-09'
Description: Amazon Lex V2 Bot for Airline Contact Center with ElevenLabs integration

Parameters:
  Environment:
    Type: String
    Description: Environment name

  FulfillmentLambdaArn:
    Type: String
    Description: ARN of the fulfillment Lambda function

Resources:
  # ==================== LEX BOT ROLE ====================
  LexBotRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Environment}-airline-lex-bot-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lexv2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LexBotPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - polly:SynthesizeSpeech
                Resource: '*'
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !Ref FulfillmentLambdaArn
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: airline-contact-center

  # ==================== LEX BOT ====================
  AirlineLexBot:
    Type: AWS::Lex::Bot
    Properties:
      Name: !Sub '${Environment}-airline-voice-agent'
      Description: Airline customer service voice agent
      RoleArn: !GetAtt LexBotRole.Arn
      DataPrivacy:
        ChildDirected: false
      IdleSessionTTLInSeconds: 300
      AutoBuildBotLocales: true
      BotLocales:
        - LocaleId: en_US
          NluConfidenceThreshold: 0.40
          VoiceSettings:
            VoiceId: Joanna
            Engine: neural
          SlotTypes:
            - Name: BaggageIssueType
              Description: Types of baggage issues
              ValueSelectionSetting:
                ResolutionStrategy: ORIGINAL_VALUE
              SlotTypeValues:
                - SampleValue:
                    Value: allowance
                - SampleValue:
                    Value: lost
                - SampleValue:
                    Value: fees
          Intents:
            # Flight Change Intent
            - Name: FlightChangeIntent
              Description: Customer wants to change their flight
              SampleUtterances:
                - Utterance: I want to change my flight
                - Utterance: I need to reschedule my flight
                - Utterance: Can I change my booking
                - Utterance: Change my flight please
              Slots:
                - Name: BookingReference
                  SlotTypeName: AMAZON.AlphaNumeric
                  ValueElicitationSetting:
                    SlotConstraint: Required
                    PromptSpecification:
                      MessageGroupsList:
                        - Message:
                            PlainTextMessage:
                              Value: Could you please provide your booking reference number?
                      MaxRetries: 2
                      AllowInterrupt: true
                - Name: NewDate
                  SlotTypeName: AMAZON.Date
                  ValueElicitationSetting:
                    SlotConstraint: Required
                    PromptSpecification:
                      MessageGroupsList:
                        - Message:
                            PlainTextMessage:
                              Value: What date would you like to change your flight to?
                      MaxRetries: 2
                      AllowInterrupt: true
              SlotPriorities:
                - Priority: 1
                  SlotName: BookingReference
                - Priority: 2
                  SlotName: NewDate
              FulfillmentCodeHook:
                Enabled: true

            # Refund Intent
            - Name: RefundIntent
              Description: Customer wants a refund
              SampleUtterances:
                - Utterance: I want a refund
                - Utterance: I need my money back
                - Utterance: Can I get a refund
                - Utterance: Refund my ticket
              Slots:
                - Name: BookingReference
                  SlotTypeName: AMAZON.AlphaNumeric
                  ValueElicitationSetting:
                    SlotConstraint: Required
                    PromptSpecification:
                      MessageGroupsList:
                        - Message:
                            PlainTextMessage:
                              Value: Could you please provide your booking reference number?
                      MaxRetries: 2
                      AllowInterrupt: true
              SlotPriorities:
                - Priority: 1
                  SlotName: BookingReference
              FulfillmentCodeHook:
                Enabled: true

            # Baggage Intent
            - Name: BaggageIntent
              Description: Customer has baggage questions
              SampleUtterances:
                - Utterance: I have a question about baggage
                - Utterance: What is the baggage allowance
                - Utterance: My bag is lost
                - Utterance: What are the baggage fees
              Slots:
                - Name: BaggageIssueType
                  SlotTypeName: BaggageIssueType
                  ValueElicitationSetting:
                    SlotConstraint: Required
                    PromptSpecification:
                      MessageGroupsList:
                        - Message:
                            PlainTextMessage:
                              Value: Are you asking about baggage allowance, lost baggage, or baggage fees?
                      MaxRetries: 2
                      AllowInterrupt: true
              SlotPriorities:
                - Priority: 1
                  SlotName: BaggageIssueType
              FulfillmentCodeHook:
                Enabled: true

            # Delay Compensation Intent
            - Name: DelayCompensationIntent
              Description: Customer wants compensation for delay
              SampleUtterances:
                - Utterance: My flight was delayed
                - Utterance: I want compensation for the delay
                - Utterance: The flight was cancelled
              Slots:
                - Name: BookingReference
                  SlotTypeName: AMAZON.AlphaNumeric
                  ValueElicitationSetting:
                    SlotConstraint: Required
                    PromptSpecification:
                      MessageGroupsList:
                        - Message:
                            PlainTextMessage:
                              Value: Could you please provide your booking reference number?
                      MaxRetries: 2
                      AllowInterrupt: true
              SlotPriorities:
                - Priority: 1
                  SlotName: BookingReference
              FulfillmentCodeHook:
                Enabled: true

            # Fallback Intent
            - Name: FallbackIntent
              Description: Default fallback intent
              ParentIntentSignature: AMAZON.FallbackIntent
              FulfillmentCodeHook:
                Enabled: true

  # ==================== BOT VERSION ====================
  AirlineLexBotVersion:
    Type: AWS::Lex::BotVersion
    DependsOn: AirlineLexBot
    Properties:
      BotId: !Ref AirlineLexBot
      BotVersionLocaleSpecification:
        - LocaleId: en_US
          BotVersionLocaleDetails:
            SourceBotVersion: DRAFT

  # ==================== BOT ALIAS ====================
  AirlineLexBotAlias:
    Type: AWS::Lex::BotAlias
    DependsOn: AirlineLexBotVersion
    Properties:
      BotId: !Ref AirlineLexBot
      BotAliasName: !Sub '${Environment}Live'
      BotVersion: !GetAtt AirlineLexBotVersion.BotVersion
      BotAliasLocaleSettings:
        - LocaleId: en_US
          BotAliasLocaleSetting:
            Enabled: true
            CodeHookSpecification:
              LambdaCodeHook:
                CodeHookInterfaceVersion: '1.0'
                LambdaArn: !Ref FulfillmentLambdaArn

Outputs:
  LexBotId:
    Description: Lex Bot ID
    Value: !Ref AirlineLexBot

  LexBotAliasId:
    Description: Lex Bot Alias ID
    Value: !GetAtt AirlineLexBotAlias.BotAliasId

  LexBotArn:
    Description: Lex Bot ARN
    Value: !GetAtt AirlineLexBot.Arn
