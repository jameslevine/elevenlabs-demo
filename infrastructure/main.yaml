AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Airline Contact Center with ElevenLabs Voice AI
  Main stack that orchestrates all nested stacks

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Environment name

  ElevenLabsApiKey:
    Type: String
    NoEcho: true
    Description: ElevenLabs API Key

  ElevenLabsAgentId:
    Type: String
    Default: ''
    Description: ElevenLabs Agent ID (optional, will be created if not provided)

Resources:
  # ==================== SECRETS ====================
  SecretsStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./secrets.yaml
      Parameters:
        Environment: !Ref Environment
        ElevenLabsApiKey: !Ref ElevenLabsApiKey

  # ==================== DYNAMODB ====================
  DynamoDBStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./dynamodb.yaml
      Parameters:
        Environment: !Ref Environment

  # ==================== S3 ====================
  S3Stack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: ./s3.yaml
      Parameters:
        Environment: !Ref Environment

  # ==================== LAMBDA ====================
  LambdaStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - SecretsStack
      - DynamoDBStack
      - S3Stack
    Properties:
      TemplateURL: ./lambda.yaml
      Parameters:
        Environment: !Ref Environment
        SessionsTableName: !GetAtt DynamoDBStack.Outputs.SessionsTableName
        ConversationsTableName: !GetAtt DynamoDBStack.Outputs.ConversationsTableName
        CustomersTableName: !GetAtt DynamoDBStack.Outputs.CustomersTableName
        KnowledgeBucketName: !GetAtt S3Stack.Outputs.KnowledgeBucketName
        ElevenLabsSecretArn: !GetAtt SecretsStack.Outputs.ElevenLabsSecretArn
        ElevenLabsAgentId: !Ref ElevenLabsAgentId

  # ==================== AMAZON CONNECT ====================
  ConnectStack:
    Type: AWS::CloudFormation::Stack
    DependsOn:
      - LambdaStack
    Properties:
      TemplateURL: ./connect.yaml
      Parameters:
        Environment: !Ref Environment

Outputs:
  SessionsTableName:
    Description: DynamoDB Sessions Table Name
    Value: !GetAtt DynamoDBStack.Outputs.SessionsTableName
    Export:
      Name: !Sub '${Environment}-SessionsTableName'

  ConversationsTableName:
    Description: DynamoDB Conversations Table Name
    Value: !GetAtt DynamoDBStack.Outputs.ConversationsTableName
    Export:
      Name: !Sub '${Environment}-ConversationsTableName'

  CustomersTableName:
    Description: DynamoDB Customers Table Name
    Value: !GetAtt DynamoDBStack.Outputs.CustomersTableName
    Export:
      Name: !Sub '${Environment}-CustomersTableName'

  KnowledgeBucketName:
    Description: S3 Knowledge Base Bucket Name
    Value: !GetAtt S3Stack.Outputs.KnowledgeBucketName
    Export:
      Name: !Sub '${Environment}-KnowledgeBucketName'

  ContactFlowLambdaArn:
    Description: Contact Flow Lambda Function ARN
    Value: !GetAtt LambdaStack.Outputs.ContactFlowLambdaArn
    Export:
      Name: !Sub '${Environment}-ContactFlowLambdaArn'

  AudioProcessorLambdaArn:
    Description: Audio Processor Lambda Function ARN
    Value: !GetAtt LambdaStack.Outputs.AudioProcessorLambdaArn
    Export:
      Name: !Sub '${Environment}-AudioProcessorLambdaArn'
