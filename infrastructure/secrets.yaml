AWSTemplateFormatVersion: '2010-09-09'
Description: Secrets Manager secrets for Airline Contact Center

Parameters:
  Environment:
    Type: String
    Description: Environment name

  ElevenLabsApiKey:
    Type: String
    NoEcho: true
    Description: ElevenLabs API Key

Resources:
  # ==================== ELEVENLABS SECRET ====================
  ElevenLabsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '${Environment}/airline-contact-center/elevenlabs'
      Description: ElevenLabs API credentials for Airline Contact Center
      SecretString: !Sub |
        {
          "apiKey": "${ElevenLabsApiKey}"
        }
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: airline-contact-center

  # ==================== SECRET ROTATION (Optional) ====================
  # Uncomment if you want to enable automatic rotation
  # ElevenLabsSecretRotation:
  #   Type: AWS::SecretsManager::RotationSchedule
  #   Properties:
  #     SecretId: !Ref ElevenLabsSecret
  #     RotationRules:
  #       AutomaticallyAfterDays: 90

Outputs:
  ElevenLabsSecretArn:
    Description: ElevenLabs Secret ARN
    Value: !Ref ElevenLabsSecret

  ElevenLabsSecretName:
    Description: ElevenLabs Secret Name
    Value: !Sub '${Environment}/airline-contact-center/elevenlabs'
