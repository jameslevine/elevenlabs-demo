AWSTemplateFormatVersion: '2010-09-09'
Description: Amazon Connect instance for Airline Contact Center

Parameters:
  Environment:
    Type: String
    Description: Environment name

  InstanceAlias:
    Type: String
    Description: Amazon Connect instance alias
    Default: airline-contact-center

Resources:
  # ==================== AMAZON CONNECT INSTANCE ====================
  ConnectInstance:
    Type: AWS::Connect::Instance
    Properties:
      InstanceAlias: !Sub '${Environment}-${InstanceAlias}'
      IdentityManagementType: CONNECT_MANAGED
      Attributes:
        InboundCalls: true
        OutboundCalls: true
        ContactflowLogs: true
        ContactLens: false
        AutoResolveBestVoices: true
        UseCustomTTSVoices: false
        EarlyMedia: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: airline-contact-center

  # ==================== CONNECT HOURS OF OPERATION ====================
  HoursOfOperation:
    Type: AWS::Connect::HoursOfOperation
    DependsOn: ConnectInstance
    Properties:
      InstanceArn: !GetAtt ConnectInstance.Arn
      Name: !Sub '${Environment}-24x7-hours'
      Description: 24/7 hours of operation for airline contact center
      TimeZone: UTC
      Config:
        - Day: SUNDAY
          StartTime:
            Hours: 0
            Minutes: 0
          EndTime:
            Hours: 23
            Minutes: 59
        - Day: MONDAY
          StartTime:
            Hours: 0
            Minutes: 0
          EndTime:
            Hours: 23
            Minutes: 59
        - Day: TUESDAY
          StartTime:
            Hours: 0
            Minutes: 0
          EndTime:
            Hours: 23
            Minutes: 59
        - Day: WEDNESDAY
          StartTime:
            Hours: 0
            Minutes: 0
          EndTime:
            Hours: 23
            Minutes: 59
        - Day: THURSDAY
          StartTime:
            Hours: 0
            Minutes: 0
          EndTime:
            Hours: 23
            Minutes: 59
        - Day: FRIDAY
          StartTime:
            Hours: 0
            Minutes: 0
          EndTime:
            Hours: 23
            Minutes: 59
        - Day: SATURDAY
          StartTime:
            Hours: 0
            Minutes: 0
          EndTime:
            Hours: 23
            Minutes: 59
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: airline-contact-center

  # ==================== CONNECT QUEUE ====================
  CustomerServiceQueue:
    Type: AWS::Connect::Queue
    DependsOn: HoursOfOperation
    Properties:
      InstanceArn: !GetAtt ConnectInstance.Arn
      Name: !Sub '${Environment}-customer-service'
      Description: Main customer service queue for airline complaints
      HoursOfOperationArn: !GetAtt HoursOfOperation.HoursOfOperationArn
      MaxContacts: 100
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: airline-contact-center

  # ==================== CONTACT FLOW ====================
  AirlineContactFlow:
    Type: AWS::Connect::ContactFlow
    DependsOn: CustomerServiceQueue
    Properties:
      InstanceArn: !GetAtt ConnectInstance.Arn
      Name: !Sub '${Environment}-airline-voice-agent'
      Description: Main contact flow for airline customer service with ElevenLabs Voice AI
      Type: CONTACT_FLOW
      State: ACTIVE
      Content: !Sub |
        {
          "Version": "2019-10-30",
          "StartAction": "12345678-1234-1234-1234-123456789012",
          "Metadata": {
            "entryPointPosition": {"x": 20, "y": 20},
            "ActionMetadata": {
              "12345678-1234-1234-1234-123456789012": {"position": {"x": 150, "y": 20}},
              "12345678-1234-1234-1234-123456789013": {"position": {"x": 400, "y": 20}},
              "12345678-1234-1234-1234-123456789014": {"position": {"x": 650, "y": 20}},
              "12345678-1234-1234-1234-123456789017": {"position": {"x": 800, "y": 20}},
              "12345678-1234-1234-1234-123456789015": {"position": {"x": 650, "y": 200}},
              "12345678-1234-1234-1234-123456789016": {"position": {"x": 950, "y": 100}}
            }
          },
          "Actions": [
            {
              "Identifier": "12345678-1234-1234-1234-123456789012",
              "Type": "UpdateContactRecordingBehavior",
              "Parameters": {
                "RecordingBehavior": {
                  "RecordedParticipants": ["Agent", "Customer"]
                }
              },
              "Transitions": {
                "NextAction": "12345678-1234-1234-1234-123456789013"
              }
            },
            {
              "Identifier": "12345678-1234-1234-1234-123456789013",
              "Type": "InvokeLambdaFunction",
              "Parameters": {
                "LambdaFunctionARN": "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${Environment}-airline-contact-flow",
                "InvocationTimeLimitSeconds": "8",
                "LambdaInvocationAttributes": {
                  "Name": "InitializeSession"
                }
              },
              "Transitions": {
                "NextAction": "12345678-1234-1234-1234-123456789014",
                "Errors": [
                  {
                    "NextAction": "12345678-1234-1234-1234-123456789015",
                    "ErrorType": "NoMatchingError"
                  }
                ]
              }
            },
            {
              "Identifier": "12345678-1234-1234-1234-123456789014",
              "Type": "MessageParticipant",
              "Parameters": {
                "Text": "$.External.greeting"
              },
              "Transitions": {
                "NextAction": "12345678-1234-1234-1234-123456789017",
                "Errors": [
                  {
                    "NextAction": "12345678-1234-1234-1234-123456789015",
                    "ErrorType": "NoMatchingError"
                  }
                ]
              }
            },
            {
              "Identifier": "12345678-1234-1234-1234-123456789017",
              "Type": "MessageParticipant",
              "Parameters": {
                "Text": "I can help you with flight changes, refunds, baggage policies, and more. Our voice assistant is currently being upgraded. Please visit skyway.com or call back later for full assistance. Thank you for calling SkyWay Airlines."
              },
              "Transitions": {
                "NextAction": "12345678-1234-1234-1234-123456789016",
                "Errors": [
                  {
                    "NextAction": "12345678-1234-1234-1234-123456789016",
                    "ErrorType": "NoMatchingError"
                  }
                ]
              }
            },
            {
              "Identifier": "12345678-1234-1234-1234-123456789015",
              "Type": "MessageParticipant",
              "Parameters": {
                "Text": "We apologize, but we are experiencing technical difficulties. Please try again later or visit our website at skyway.com for assistance."
              },
              "Transitions": {
                "NextAction": "12345678-1234-1234-1234-123456789016",
                "Errors": [
                  {
                    "NextAction": "12345678-1234-1234-1234-123456789016",
                    "ErrorType": "NoMatchingError"
                  }
                ]
              }
            },
            {
              "Identifier": "12345678-1234-1234-1234-123456789016",
              "Type": "DisconnectParticipant",
              "Parameters": {},
              "Transitions": {}
            }
          ]
        }
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: airline-contact-center

Outputs:
  ConnectInstanceId:
    Description: Amazon Connect Instance ID
    Value: !GetAtt ConnectInstance.Id

  ConnectInstanceArn:
    Description: Amazon Connect Instance ARN
    Value: !GetAtt ConnectInstance.Arn

  HoursOfOperationArn:
    Description: Hours of Operation ARN
    Value: !GetAtt HoursOfOperation.HoursOfOperationArn

  CustomerServiceQueueArn:
    Description: Customer Service Queue ARN
    Value: !GetAtt CustomerServiceQueue.QueueArn

  ContactFlowArn:
    Description: Airline Contact Flow ARN
    Value: !GetAtt AirlineContactFlow.ContactFlowArn
