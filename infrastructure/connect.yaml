AWSTemplateFormatVersion: '2010-09-09'
Description: Amazon Connect instance for Airline Contact Center

Parameters:
  Environment:
    Type: String
    Description: Environment name

  InstanceAlias:
    Type: String
    Description: Amazon Connect instance alias
    Default: airline-contact-center

  LexBotAliasArn:
    Type: String
    Description: ARN of the Lex V2 bot alias for voice interaction
    Default: ''

Resources:
  # ==================== AMAZON CONNECT INSTANCE ====================
  ConnectInstance:
    Type: AWS::Connect::Instance
    Properties:
      InstanceAlias: !Sub '${Environment}-${InstanceAlias}'
      IdentityManagementType: CONNECT_MANAGED
      Attributes:
        InboundCalls: true
        OutboundCalls: true
        ContactflowLogs: true
        ContactLens: false
        AutoResolveBestVoices: true
        UseCustomTTSVoices: false
        EarlyMedia: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: airline-contact-center

  # ==================== CONNECT HOURS OF OPERATION ====================
  HoursOfOperation:
    Type: AWS::Connect::HoursOfOperation
    DependsOn: ConnectInstance
    Properties:
      InstanceArn: !GetAtt ConnectInstance.Arn
      Name: !Sub '${Environment}-24x7-hours'
      Description: 24/7 hours of operation for airline contact center
      TimeZone: UTC
      Config:
        - Day: SUNDAY
          StartTime:
            Hours: 0
            Minutes: 0
          EndTime:
            Hours: 23
            Minutes: 59
        - Day: MONDAY
          StartTime:
            Hours: 0
            Minutes: 0
          EndTime:
            Hours: 23
            Minutes: 59
        - Day: TUESDAY
          StartTime:
            Hours: 0
            Minutes: 0
          EndTime:
            Hours: 23
            Minutes: 59
        - Day: WEDNESDAY
          StartTime:
            Hours: 0
            Minutes: 0
          EndTime:
            Hours: 23
            Minutes: 59
        - Day: THURSDAY
          StartTime:
            Hours: 0
            Minutes: 0
          EndTime:
            Hours: 23
            Minutes: 59
        - Day: FRIDAY
          StartTime:
            Hours: 0
            Minutes: 0
          EndTime:
            Hours: 23
            Minutes: 59
        - Day: SATURDAY
          StartTime:
            Hours: 0
            Minutes: 0
          EndTime:
            Hours: 23
            Minutes: 59
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: airline-contact-center

  # ==================== CONNECT QUEUE ====================
  CustomerServiceQueue:
    Type: AWS::Connect::Queue
    DependsOn: HoursOfOperation
    Properties:
      InstanceArn: !GetAtt ConnectInstance.Arn
      Name: !Sub '${Environment}-customer-service'
      Description: Main customer service queue for airline complaints
      HoursOfOperationArn: !GetAtt HoursOfOperation.HoursOfOperationArn
      MaxContacts: 100
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: airline-contact-center

  # ==================== CONTACT FLOW ====================
  # Note: Contact flow with Lex V2 bot integration
  # The ConnectParticipantWithLexBot action enables voice interaction
  AirlineContactFlow:
    Type: AWS::Connect::ContactFlow
    DependsOn: CustomerServiceQueue
    Properties:
      InstanceArn: !GetAtt ConnectInstance.Arn
      Name: !Sub '${Environment}-airline-voice-agent'
      Description: Main contact flow for airline customer service with Lex V2 voice interaction
      Type: CONTACT_FLOW
      State: ACTIVE
      Content: !Sub |
        {
          "Version": "2019-10-30",
          "StartAction": "start-recording",
          "Metadata": {
            "entryPointPosition": {"x": 20, "y": 20},
            "ActionMetadata": {
              "start-recording": {"position": {"x": 150, "y": 20}},
              "init-lambda": {"position": {"x": 300, "y": 20}},
              "welcome-message": {"position": {"x": 450, "y": 20}},
              "lex-bot-input": {"position": {"x": 600, "y": 20}},
              "continue-prompt": {"position": {"x": 750, "y": 20}},
              "error-message": {"position": {"x": 600, "y": 200}},
              "disconnect": {"position": {"x": 900, "y": 100}}
            }
          },
          "Actions": [
            {
              "Identifier": "start-recording",
              "Type": "UpdateContactRecordingBehavior",
              "Parameters": {
                "RecordingBehavior": {
                  "RecordedParticipants": ["Agent", "Customer"]
                }
              },
              "Transitions": {
                "NextAction": "init-lambda"
              }
            },
            {
              "Identifier": "init-lambda",
              "Type": "InvokeLambdaFunction",
              "Parameters": {
                "LambdaFunctionARN": "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${Environment}-airline-contact-flow",
                "InvocationTimeLimitSeconds": "8",
                "LambdaInvocationAttributes": {
                  "Name": "InitializeSession"
                }
              },
              "Transitions": {
                "NextAction": "welcome-message",
                "Errors": [
                  {
                    "NextAction": "welcome-message",
                    "ErrorType": "NoMatchingError"
                  }
                ]
              }
            },
            {
              "Identifier": "welcome-message",
              "Type": "MessageParticipant",
              "Parameters": {
                "Text": "Welcome to SkyWay Airlines. I am your virtual assistant. How can I help you today? You can ask about flight changes, refunds, baggage, or delay compensation."
              },
              "Transitions": {
                "NextAction": "lex-bot-input",
                "Errors": [
                  {
                    "NextAction": "error-message",
                    "ErrorType": "NoMatchingError"
                  }
                ]
              }
            },
            {
              "Identifier": "lex-bot-input",
              "Type": "ConnectParticipantWithLexBot",
              "Parameters": {
                "Text": "How can I help you?",
                "LexV2Bot": {
                  "AliasArn": "${LexBotAliasArn}"
                }
              },
              "Transitions": {
                "NextAction": "continue-prompt",
                "Errors": [
                  {
                    "NextAction": "error-message",
                    "ErrorType": "NoMatchingError"
                  },
                  {
                    "NextAction": "error-message",
                    "ErrorType": "NoMatchingCondition"
                  },
                  {
                    "NextAction": "error-message",
                    "ErrorType": "InputTimeLimitExceeded"
                  }
                ]
              }
            },
            {
              "Identifier": "continue-prompt",
              "Type": "MessageParticipant",
              "Parameters": {
                "Text": "Is there anything else I can help you with?"
              },
              "Transitions": {
                "NextAction": "lex-bot-input",
                "Errors": [
                  {
                    "NextAction": "disconnect",
                    "ErrorType": "NoMatchingError"
                  }
                ]
              }
            },
            {
              "Identifier": "error-message",
              "Type": "MessageParticipant",
              "Parameters": {
                "Text": "I am sorry, I did not understand that. Please try again or say goodbye to end the call."
              },
              "Transitions": {
                "NextAction": "lex-bot-input",
                "Errors": [
                  {
                    "NextAction": "disconnect",
                    "ErrorType": "NoMatchingError"
                  }
                ]
              }
            },
            {
              "Identifier": "disconnect",
              "Type": "DisconnectParticipant",
              "Parameters": {},
              "Transitions": {}
            }
          ]
        }
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: airline-contact-center

Outputs:
  ConnectInstanceId:
    Description: Amazon Connect Instance ID
    Value: !GetAtt ConnectInstance.Id

  ConnectInstanceArn:
    Description: Amazon Connect Instance ARN
    Value: !GetAtt ConnectInstance.Arn

  HoursOfOperationArn:
    Description: Hours of Operation ARN
    Value: !GetAtt HoursOfOperation.HoursOfOperationArn

  CustomerServiceQueueArn:
    Description: Customer Service Queue ARN
    Value: !GetAtt CustomerServiceQueue.QueueArn

  ContactFlowArn:
    Description: Airline Contact Flow ARN
    Value: !GetAtt AirlineContactFlow.ContactFlowArn
